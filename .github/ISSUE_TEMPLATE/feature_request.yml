name: Feature request
description: Suggest a focused improvement
title: "[Idea]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Ideas are welcome. Explain the workflow first; a proposed interface is optional.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Suggested approach
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Inventory, Smart profiles, Mobile, Documents, Reports and backup, Studio planning, Loans, Software, Installation, Other]
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or examples
      description: Optional links, mockups, or workarounds.
