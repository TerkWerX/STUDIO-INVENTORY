<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Studio Inventory</title>
  <desc id="desc">Local-first gear catalog, documentation, and studio planning</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101722"/>
      <stop offset="0.55" stop-color="#19263a"/>
      <stop offset="1" stop-color="#102b2c"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4da3ff"/>
      <stop offset="1" stop-color="#3dd68c"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <circle cx="1035" cy="58" r="130" fill="#4da3ff" opacity=".08" filter="url(#glow)"/>
  <circle cx="110" cy="300" r="155" fill="#3dd68c" opacity=".07" filter="url(#glow)"/>
